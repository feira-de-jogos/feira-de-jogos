name: Frontend (Docker)

on:
  push:
    branches:
      - main
    paths:
      - "nuvem/frontend/**"
      - ".github/workflows/build-frontend.yaml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.9.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}/frontend:latest"
          docker build -t $IMAGE_NAME ./nuvem/frontend
          docker push $IMAGE_NAME