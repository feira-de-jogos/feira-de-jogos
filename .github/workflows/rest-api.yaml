name: Build and Push Node.js App to GHCR (Buildpacks)

on:
  push:
    branches:
      - main
    paths:
      - 'nuvem/rest-api/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pack CLI
        run: |
          curl -sSL "https://github.com/buildpacks/pack/releases/latest/download/pack-v0.35.0-linux.tgz" | tar -C /tmp -xzvf -
          sudo mv /tmp/pack /usr/local/bin/
          pack --version

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | pack registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image with Buildpacks
        run: |
          pack build ghcr.io/${{ github.repository }}/rest-api:latest \
            --builder gcr.io/buildpacks/builder:latest \
            --path ./nuvem/rest-api \
            --publish
        env:
          BP_NODE_RUN_SCRIPTS: build
          BP_NODE_PROJECT_PATH: ./nuvem/rest-api

      - name: Tag image with commit SHA
        run: |
          # Baixa a imagem que acabamos de publicar
          docker pull ghcr.io/${{ github.repository }}/rest-api:latest
          # Cria uma nova tag com o SHA do commit
          docker tag ghcr.io/${{ github.repository }}/rest-api:latest ghcr.io/${{ github.repository }}/rest-api:sha-${{ github.sha }}
          # Faz login novamente para fazer push da nova tag
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}/rest-api:sha-${{ github.sha }}