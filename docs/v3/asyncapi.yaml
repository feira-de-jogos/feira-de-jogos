asyncapi: 3.0.0
info:
  description: Feira de Jogos do IFSC campus São José
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Feira de Jogos
  version: 2.1.0
  externalDocs:
    url: https://feira-de-jogos.github.io/feira-de-jogos/
  tags:
    - $ref: "#/components/tags/player"
    - $ref: "#/components/tags/server"
servers:
  production:
    host: feira-de-jogos.dev.br
    description: WebSocket server
    pathname: /api/v3
    protocol: wss
defaultContentType: application/json
channels:
  player:
    address: Player
    messages:
      pingRequest:
        $ref: "#/components/messages/pingRequest"
    tags:
      - $ref: "#/components/tags/player"
  server:
    address: Server
    messages:
      pingResponse:
        $ref: "#/components/messages/pingResponse"
    tags:
      - $ref: "#/components/tags/server"
operations:
  Ping:
    action: send
    channel:
      $ref: "#/channels/player"
    messages:
      - $ref: "#/channels/player/messages/pingRequest"
    reply:
      messages:
        - $ref: "#/components/messages/pingResponse"
    tags:
      - $ref: "#/components/tags/player"
components:
  messages:
    pingRequest:
      title: Ping
      description: Ping to main server
      payload:
        type: object
        properties:
          type:
            type: string
            enum: ["request"]
          method:
            type: string
            enum: ["ping"]
          from:
            type: string
            description: Sender's identifier
          to:
            type: string
            description: Receiver's identifier
          timestamp:
            type: integer
            description: Timestamp in miliseconds
        required:
          - type
          - method
          - from
          - to
          - timestamp
        examples:
          - type: request
            method: ping
            from: ederson@ifsc.edu.br
            to: server@feira-de-jogos.dev.br
            timestamp: 1756868440297
      tags:
        - $ref: "#/components/tags/player"
    pingResponse:
      title: Ping Response
      description: Ping response from main server
      payload:
        type: object
        properties:
          type:
            type: string
            enum: ["response"]
          method:
            type: string
            enum: ["ping"]
          from:
            type: string
            description: Sender's identifier
          to:
            type: string
            description: Receiver's identifier
          timestamp:
            type: integer
            description: Timestamp in miliseconds
        required:
          - type
          - method
          - from
          - to
          - timestamp
        examples:
          - type: response
            method: ping
            from: ederson@ifsc.edu.br
            to: server@feira-de-jogos.dev.br
            timestamp: 1756868440297
      tags:
        - $ref: "#/components/tags/server"
  tags:
    player:
      name: player
      description: From player
    server:
      name: server
      description: From main server