##############################################
# InfluxDB (tsdb) — alta frequência de escrita
# Usa longhorn-fast: 2 réplicas + data locality
##############################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tsdb-data
  namespace: feira-de-jogos
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-fast
  resources:
    requests:
      storage: 10Gi
---
##############################################
# PostgreSQL (db) — banco relacional
# Usa longhorn-fast: 2 réplicas + data locality
##############################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: feira-de-jogos
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-fast
  resources:
    requests:
      storage: 10Gi
---
##############################################
# Grafana — dashboards e configurações
# Usa longhorn padrão: 3 réplicas
##############################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: feira-de-jogos
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
