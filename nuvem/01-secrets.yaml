# ATENÇÃO: substitua os valores abaixo por base64 reais antes de aplicar.
# Gere com: echo -n 'seu-valor' | base64

apiVersion: v1
kind: Secret
metadata:
  name: tsdb-secrets
  namespace: feira-de-jogos
type: Opaque
data:
  tsdb-username: CHANGE_ME_BASE64   # echo -n 'admin' | base64
  tsdb-password: CHANGE_ME_BASE64   # echo -n 'senha-segura' | base64
  tsdb-admin-token: CHANGE_ME_BASE64  # echo -n 'token-influx' | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: feira-de-jogos
type: Opaque
data:
  db: CHANGE_ME_BASE64   # echo -n 'senha-postgres' | base64

# O Secret "tls-feira" (TLS) é criado e renovado automaticamente
# pelo cert-manager via 06-cert-manager.yaml. Não é necessário criá-lo manualmente.
